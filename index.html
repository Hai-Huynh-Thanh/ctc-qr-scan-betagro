<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
 
  <style>
    body { background: #f2f4f7; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .app-box { max-width: 440px; margin: auto; background: #fff; min-height: 100vh; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
    .header { display: flex; align-items: center; gap: 16px; padding-bottom: 12px; border-bottom: 2px solid #e0e0e0; }
    .logo { height: 55px; }
    .main-title { font-size: 17px; font-weight: 700; color: #003366; line-height: 1.3; }
    .sub-title { font-size: 13px; color: #555; margin-top: 2px; }
    #formulaList li { cursor: pointer; font-size: 15px; }
    #formulaList li:hover { background-color: #f1f5ff; }
    .progress-box { background: #f8f9fa; border-radius: 8px; padding: 12px; margin-top: 15px; border: 1px solid #e2e8f0; }
    .material-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #e2e8f0; }
    .material-item:last-child { border-bottom: none; }
    .done-item { background-color: #e8f5e9; font-style: italic; color: #2e7d32; }
    .text-note { font-size: 11px; color: #ff6f00; display: block; font-weight: 500; margin-top: 2px; }
    #reader { width: 100%; background: #000; border-radius: 12px; overflow: hidden; position: relative; min-height: 250px; display: none; }
    
    /* LỚP ĐỊNH DẠNG TIẾNG ANH THEO YÊU CẦU: XANH LÁ ĐẬM + CHỮ NGHIÊNG */
    .en-txt { color: #1b5e20 !important; font-style: italic !important; font-weight: normal !important; font-size: 0.9em; }
  </style>
</head>
<body>
 
<div class="app-box">
  <div class="header">
    <img src="https://ctcbio.com.vn/wp-content/uploads/2017/06/logo-ctc2-250x250.jpg" class="logo">
    <div class="title">
      <div class="main-title">Hệ Thống Xác Thực Nguyên Liệu<br><span class="en-txt">Material Verification System</span></div>
    </div>
  </div>
 
  <div class="mb-3 position-relative mt-3">
    <label class="form-label fw-bold text-secondary">Công thức đang sản xuất<br><span class="en-txt">Production Formula</span></label>
    <input type="text" class="form-control form-control-lg" id="formula" placeholder="🔍 Tìm công thức... / Search formula..." autocomplete="off">
    <ul id="formulaList" class="list-group position-absolute w-100 d-none" style="z-index:1000; max-height:200px; overflow-y:auto;"></ul>
  </div>
 
  <div id="progressContainer" class="progress-box d-none">
    <div class="fw-bold mb-2 text-dark border-bottom pb-1">
      📋 Trình tự nạp nguyên liệu:<br><span class="en-txt">Material Charging Progress:</span>
    </div>
    <div id="bomList"></div>
  </div>
 
  <div class="d-grid gap-2 my-3">
    <button class="btn btn-lg w-100" id="btnStartCam" onclick="startCameraDirectly()" disabled style="background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7;">
      <strong>📷 Bật Camera Quét QR</strong><br><span class="en-txt">Turn on QR Camera</span>
    </button>
    <button class="btn btn-lg w-100 d-none" id="btnStopCam" onclick="stopCameraDirectly()" style="background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a;">
      <strong>🛑 Tắt Camera</strong><br><span class="en-txt">Turn off Camera</span>
    </button>
  </div>
 
  <div id="reader" class="mb-3 shadow-sm"></div>
 
  <div id="loading" class="text-center my-3 d-none">
    <div class="spinner-border text-primary"></div>
    <div class="mt-2 text-muted">Đang xử lý dữ liệu...<br><span class="en-txt">Processing data...</span></div>
  </div>
</div>
 
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
 
<script>
  // 🔴 🔴 THAY ĐƯỜNG LINK WEB APP APPS SCRIPT CỦA BẠN VÀO ĐÂY 🔴 🔴
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyFtKD-FUgS676OIp485eUPMMArv7BsSJcD1RGoDZhdk1Bo33OmYg8KEgSHRR3ta6N0Dg/exec"; 

  let html5Qrcode;
  let allFormulas = [];
  let isProcessingScan = false;
 
  const input = document.getElementById("formula");
  const list = document.getElementById("formulaList");
 
  document.addEventListener("DOMContentLoaded", () => {
    html5Qrcode = new Html5Qrcode("reader");
    showLoading();
    
    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getAllowedFormulas" })
    })
    .then(res => res.json())
    .then(res => {
      hideLoading();
      if (res.status === "SUCCESS") {
        allFormulas = res.data;
      } else {
        Swal.fire({
          icon: 'error',
          title: 'Lỗi dữ liệu / <span class="en-txt">Data error</span>',
          html: 'Không thể lấy danh sách công thức.<br><span class="en-txt">Cannot retrieve formula list.</span>'
        });
      }
    })
    .catch(err => {
      hideLoading();
      Swal.fire({
        icon: 'error',
        title: 'Lỗi Hệ Thống / <span class="en-txt">System Error</span>',
        html: 'Không thể kết nối đến máy chủ Google Sheets.<br><span class="en-txt">Unable to connect to Google Sheets server.</span>'
      });
    });
  });
 
  input.addEventListener("input", () => {
    const keyword = input.value.toUpperCase().trim();
    list.innerHTML = "";
    if (!keyword || allFormulas.length === 0) { list.classList.add("d-none"); return; }
   
    const matched = allFormulas.filter(f => f.toUpperCase().includes(keyword));
    if (matched.length === 0) { list.classList.add("d-none"); return; }
 
    matched.forEach(f => {
      const li = document.createElement("li");
      li.className = "list-group-item";
      li.textContent = f;
      li.onclick = () => {
        input.value = f;
        list.classList.add("d-none");
        loadFormulaProgress(f);
      };
      list.appendChild(li);
    });
    list.classList.remove("d-none");
  });
 
  function loadFormulaProgress(formulaName) {
    showLoading();
    
    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getFormulaDetails", formula: formulaName })
    })
    .then(res => res.json())
    .then(res => {
      hideLoading();
      if (res.status !== "SUCCESS") {
        Swal.fire({ icon: 'error', title: 'Lỗi / <span class="en-txt">Error</span>', html: 'Không thể tải tiến độ.<br><span class="en-txt">Failed to load progress.</span>' });
        return;
      }
      
      const bomProgress = res.data;
      const container = document.getElementById("progressContainer");
      const bomList = document.getElementById("bomList");
      const btnStartCam = document.getElementById("btnStartCam");
     
      bomList.innerHTML = "";
      if(bomProgress && bomProgress.length > 0) {
        container.classList.remove("d-none");
        btnStartCam.disabled = false;
       
        bomProgress.forEach(item => {
          const div = document.createElement("div");
          const isDone = item.scannedBags >= item.reqBags;
          div.className = `material-item ${isDone ? 'done-item px-2 rounded' : ''}`;
          
          // Tạo chuỗi ghi chú bao bì song ngữ định dạng chuẩn
          const fullBagsCount = Math.floor(item.reqWeight / item.packSize);
          const remainder = parseFloat((item.reqWeight % item.packSize).toFixed(2));
          let noteHtml = ``;
          if (remainder > 0) {
            noteHtml = `(${fullBagsCount} bao nguyên + 1 bao lẻ ${remainder}kg)<br><span class="en-txt">(${fullBagsCount} full bags + 1 partial bag ${remainder}kg)</span>`;
          } else {
            noteHtml = `(${item.packSize}kg/bao)<br><span class="en-txt">(${item.packSize}kg/bag)</span>`;
          }
         
          // item.name được in ra nguyên vẹn đúng 100% chữ trong file nguồn của bạn
          div.innerHTML = `
            <div style="max-width: 70%;">
              <strong class="d-block">${item.name}</strong>
              <small class="text-muted d-block">Mã/Code: ${item.code} | Tổng/Total: ${item.reqWeight}kg</small>
              <span class="text-note">${noteHtml}</span>
            </div>
            <div>
              <span class="badge ${isDone ? 'bg-success' : 'bg-warning text-dark'} fs-6">
                ${item.scannedBags}/${item.reqBags} bao/bags
              </span>
            </div>
          `;
          bomList.appendChild(div);
        });
      } else {
        container.classList.add("d-none");
        btnStartCam.disabled = true;
        Swal.fire({ icon: 'info', title: 'Thông báo / <span class="en-txt">Notification</span>', html: 'Công thức chưa có nguyên liệu Hoạt động!<br><span class="en-txt">Formula has no Active materials!</span>' });
      }
    })
    .catch(err => {
      hideLoading(); 
      Swal.fire({ icon: 'error', title: 'Lỗi / <span class="en-txt">Error</span>', html: 'Mất kết nối khi tải dữ liệu công thức.<br><span class="en-txt">Disconnected while loading formula data.</span>' }); 
    });
  }
 
  function startCameraDirectly() {
    document.getElementById("reader").style.display = "block";
    document.getElementById("btnStartCam").classList.add("d-none");
    document.getElementById("btnStopCam").classList.remove("d-none");
 
    Html5Qrcode.getCameras().then(devices => {
      if (devices && devices.length > 0) {
        let cameraId = devices[0].id;
        for (let i = 0; i < devices.length; i++) {
          let label = devices[i].label.toLowerCase();
          if (label.includes("back") || label.includes("sau") || label.includes("environment")) {
            cameraId = devices[i].id;
            break;
          }
        }
        
        html5Qrcode.start(
          cameraId,
          { fps: 10, qrbox: { width: 230, height: 230 } },
          onScanSuccess,
          onScanFailure
        ).catch(err => {
          Swal.fire({ icon: 'error', title: 'Lỗi camera / <span class="en-txt">Camera error</span>', html: 'Không thể kích hoạt luồng camera phần cứng.<br><span class="en-txt">Failed to activate hardware camera stream.</span>' });
          stopCameraDirectly();
        });
      } else {
        Swal.fire({ icon: 'error', title: 'Lỗi thiết bị / <span class="en-txt">Device error</span>', html: 'Không tìm thấy hệ thống camera khả dụng.<br><span class="en-txt">No available camera found.</span>' });
        stopCameraDirectly();
      }
    }).catch(err => {
      Swal.fire({ icon: 'error', title: 'Cấp quyền / <span class="en-txt">Permission required</span>', html: 'Vui lòng cho phép trình duyệt truy cập camera!<br><span class="en-txt">Please allow browser to access camera!</span>' });
      stopCameraDirectly();
    });
  }
 
  function stopCameraDirectly() {
    if (html5Qrcode) {
      html5Qrcode.stop().then(() => {
        document.getElementById("reader").style.display = "none";
        document.getElementById("btnStartCam").classList.remove("d-none");
        document.getElementById("btnStopCam").classList.add("d-none");
        isProcessingScan = false;
      }).catch(err => {
        document.getElementById("reader").style.display = "none";
        document.getElementById("btnStartCam").classList.remove("d-none");
        document.getElementById("btnStopCam").classList.add("d-none");
        isProcessingScan = false;
      });
    }
  }
 
  function onScanSuccess(decodedText) {
    if (isProcessingScan) return; 
    isProcessingScan = true; 
 
    const formula = input.value.trim();
    showLoading();
 
    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "scanMaterial", materialQR: decodedText, formula: formula })
    })
    .then(res => res.json())
    .then(res => {
      hideLoading();
      if (res.status === "GREAT") {
        if (res.isPartialBag) {
          Swal.fire({
            title: `⚠️ CHÚ Ý: BAO LẺ [${res.currentBag}/${res.totalBags}]<br><span class="en-txt">ATTENTION: PARTIAL BAG</span>`,
            html: `Nguyên liệu / <span class="en-txt">Material</span>: <strong>${res.materialName}</strong><br><br>👉 VUI LÒNG CÂN LẺ ĐÚNG: <span style="color:red; font-weight:bold; font-size:1.2em;">${res.partialWeight} KG</span><br><span class="en-txt">PLEASE WEIGH EXACTLY: ${res.partialWeight} KG</span><br><br>(Không đổ hết cả bao! / <span class="en-txt">Do not pour the entire bag!</span>)`,
            icon: "warning",
            allowOutsideClick: false,
            confirmButtonText: 'Đã hiểu và đã cân lẻ / Understood'
          }).then(() => {
            loadFormulaProgress(formula);
            isProcessingScan = false; 
          });
        } else {
          Swal.fire({
            title: `THÀNH CÔNG ✅ [${res.currentBag}/${res.totalBags}]<br><span class="en-txt">SUCCESS</span>`,
            html: `Xác nhận / <span class="en-txt">Confirmed</span>: <strong>${res.materialName}</strong><br><br>Hãy nạp 1 bao NGUYÊN (${res.packSize} kg).<br><span class="en-txt">Please charge 1 FULL bag (${res.packSize} kg).</span>`,
            icon: "success",
            timer: 3000,
            showConfirmButton: false
          }).then(() => {
            loadFormulaProgress(formula);
            isProcessingScan = false; 
          });
        }
      } else {
        Swal.fire({
          icon: 'error',
          title: 'THẤT BẠI ❌ / <span class="en-txt">FAILED</span>',
          html: res.message
        }).then(() => { 
          isProcessingScan = false; 
        });
      }
    })
    .catch(err => {
      hideLoading();
      Swal.fire({
        icon: 'error',
        title: 'Lỗi mạng / <span class="en-txt">Network Error</span>',
        html: 'Mất liên lạc với máy chủ Google Sheets.<br><span class="en-txt">Lost connection to Google Sheets server.</span>'
      }).then(() => { 
        isProcessingScan = false; 
      });
    });
  }
 
  function onScanFailure(error) {}
  function showLoading() { document.getElementById("loading").classList.remove("d-none"); }
  function hideLoading() { document.getElementById("loading").classList.add("d-none"); }
  document.addEventListener("click", e => { if (!e.target.closest(".position-relative")) list.classList.add("d-none"); });
</script>
</body>
</html>
